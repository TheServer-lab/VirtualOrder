<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Virtual Order</title>
  <desc>A square emblem: a dial of sixteen memory-cell ticks around a downward chevron, evoking VMA addressing and sequential execution.</desc>

  <rect x="0" y="0" width="256" height="256" rx="48" fill="#12141c"/>

  <!-- radial dial: sixteen VMA "cells", five lit amber to suggest a run of addresses in progress,
       one cyan tick marking the currently active cell -->
  <g>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#ffb454" transform="rotate(0.0 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#ffb454" transform="rotate(22.5 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#ffb454" transform="rotate(45.0 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#ffb454" transform="rotate(67.5 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#ffb454" transform="rotate(90.0 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#6fd9c9" transform="rotate(112.5 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#333a52" transform="rotate(135.0 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#333a52" transform="rotate(157.5 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#333a52" transform="rotate(180.0 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#333a52" transform="rotate(202.5 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#333a52" transform="rotate(225.0 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#333a52" transform="rotate(247.5 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#333a52" transform="rotate(270.0 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#333a52" transform="rotate(292.5 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#333a52" transform="rotate(315.0 128 128)"/>
    <rect x="124" y="18" width="8" height="26" rx="2" fill="#333a52" transform="rotate(337.5 128 128)"/>
  </g>

  <!-- forward-execution chevron -->
  <path d="M92 96 L128 152 L164 96" fill="none" stroke="#ffb454" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- current-address cursor -->
  <circle cx="128" cy="176" r="7" fill="#6fd9c9"/>
</svg>
